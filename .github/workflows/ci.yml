name: CI

# Vercel builds and deploys on push, so CI's job is to be the gate in front of
# that: fail the PR before a broken build reaches production.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Actions are pinned by commit SHA, not by tag: a tag can be moved to point at
# new code. Same reasoning as the frozen lockfile (see SECURITY.md).

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # CI installs natively rather than in the dev container on purpose: it
      # mirrors how Vercel builds, which is what we are gating.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # Fails on any lockfile drift instead of silently resolving a new tree.
      - run: pnpm install --frozen-lockfile

      # Re-checked in CI, not just in the pre-commit hook: a hook can be
      # skipped with --no-verify, CI cannot.
      - name: Format
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm check

      - name: Tests
        run: pnpm test

      - name: Build
        run: pnpm build

      # Dependency scripts are blocked by default; this fails if someone
      # allowlists one without review.
      - name: Assert no dependency build scripts are allowlisted
        run: |
          allowed=$(node -p "JSON.stringify(require('./package.json').pnpm?.onlyBuiltDependencies ?? [])")
          if [ "$allowed" != "[]" ]; then
            echo "::error::onlyBuiltDependencies is non-empty ($allowed). Justify it in SECURITY.md and update this check."
            exit 1
          fi
