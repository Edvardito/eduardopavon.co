name: CI

# The gate in front of Vercel, which deploys on push.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Actions are pinned by commit SHA, not tag; see SECURITY.md.

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Native, not the dev container: this mirrors how Vercel builds.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The pre-commit hook can be skipped with --no-verify; CI cannot.
      - name: Format
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm check

      - name: Tests
        run: pnpm test

      - name: Build
        run: pnpm build

      # Typekit's font-display can beat the config's; this proves what shipped.
      - name: Assert no font blocks first paint
        run: |
          if grep -rl 'font-display:auto' .vercel/output/static --include='*.html'; then
            echo "::error::A face shipped with font-display:auto. See astro.config.ts and DESIGN.md, Typography."
            exit 1
          fi

      # The adapter spells CSP routes as `trailingSlash` does; this proves they match.
      - name: Assert the CSP reaches every URL the sitemap publishes
        run: |
          node -e "
            const fs = require('fs');
            const config = JSON.parse(fs.readFileSync('.vercel/output/config.json', 'utf8'));
            const covered = new Set(
              config.routes
                .filter((r) => r.headers && r.headers['content-security-policy'])
                .map((r) => r.src),
            );
            const sitemap = fs.readFileSync('.vercel/output/static/sitemap-0.xml', 'utf8');
            const paths = [...sitemap.matchAll(/<loc>([^<]+)<\/loc>/g)].map((m) => new URL(m[1]).pathname);
            const missing = paths.filter((p) => !covered.has(p));
            if (missing.length) {
              console.error('::error::No CSP header route for ' + missing.join(', '));
              process.exit(1);
            }
            console.log('CSP covers ' + paths.length + ' published URLs');
          "

      - name: Assert no dependency build scripts are allowlisted
        run: |
          allowed=$(node -p "JSON.stringify(require('./package.json').pnpm?.onlyBuiltDependencies ?? [])")
          if [ "$allowed" != "[]" ]; then
            echo "::error::onlyBuiltDependencies is non-empty ($allowed). Justify it in SECURITY.md and update this check."
            exit 1
          fi
