services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - '4321:4321'
    volumes:
      - .:/app
      # Shadows the host's node_modules, which is built for the host OS/arch
      # and would break inside the container.
      - node_modules:/app/node_modules
      - pnpm_store:/pnpm-store
      - vite_cache:/vite-cache
    environment:
      # Bind-mount file events are unreliable on Windows/macOS; watch by polling.
      CHOKIDAR_USEPOLLING: 'true'
      # Keeps `pnpm build` from invalidating the dev server's dependency cache.
      VITE_CACHE_DIR: /vite-cache
    stdin_open: true
    tty: true

  # One-shot artwork import; the profile keeps `docker compose up` off it.
  # ARTWORK_ORIGINALS comes from .env, so one command works in every shell.
  images:
    build:
      context: .
      dockerfile: Dockerfile
    profiles: ['tools']
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - ${ARTWORK_ORIGINALS:-.}:/originals:ro
    environment:
      ARTWORK_SOURCE_DIR: /originals
    command: pnpm images:import

volumes:
  node_modules:
  pnpm_store:
  vite_cache:
