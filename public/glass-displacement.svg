<!-- Not an image: R and G are COORDINATES (128 = no offset), which is why the
  palette rule does not apply. The radial overlay keeps the bend at the rim. -->
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="x" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#000000" />
      <stop offset="1" stop-color="#ff0000" />
    </linearGradient>
    <linearGradient id="y" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000000" />
      <stop offset="1" stop-color="#00ff00" />
    </linearGradient>
    <radialGradient id="core">
      <stop offset="0" stop-color="#808000" stop-opacity="1" />
      <stop offset="0.56" stop-color="#808000" stop-opacity="1" />
      <stop offset="1" stop-color="#808000" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="256" height="256" fill="url(#x)" />
  <rect width="256" height="256" fill="url(#y)" style="mix-blend-mode: screen" />
  <rect width="256" height="256" fill="url(#core)" />
</svg>
